[project]
name = "lingua"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jahus1loh", email = "jan@pastucha.pl" }
]
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "flask>=3.0",
    "flask-bcrypt>=1.0.1",
    "flask-limiter>=4.1.1",
    "flask-wtf>=1.3.0",
    "mysql>=0.0.3",
    "mysql-connector>=2.2.9",
    "mysql-connector-python>=26.10.0",
    "pytest>=8.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.3",
]

[project.scripts]
lingua = "lingua:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
